<!doctype html>
<html lang="en" class="lf-retro-enabled" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#001010">
  <meta name="description" content="LiteraryFriend is an accessible fiction IDE for writing, planning, worldbuilding, continuity, organization, book building, and publishing.">
  <title>LiteraryFriend</title>
  <link rel="icon" href="assets/images/Icon.png">
  <link rel="manifest" href="json/literaryfriend.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/accessibility.css">
  <link rel="stylesheet" href="css/retro.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <link rel="stylesheet" href="css/final-completion.css">
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to workspace</a>
  <div id="app" class="app-shell" aria-busy="true">
    <header class="topbar" role="banner">
      <button id="navToggle" class="icon-button topbar__menu" type="button" aria-label="Open LiteraryFriend navigation" aria-expanded="false" aria-controls="sidebar">☰</button>
      <div class="brand-lockup" aria-label="LiteraryFriend">
        <img class="brand-icon" src="assets/images/Icon.png" alt="" width="44" height="44">
        <span class="brand-wordmark">LiteraryFriend</span>
        <span class="brand-tagline">Writer Workspace</span>
      </div>
      <label class="global-search" for="globalSearch">
        <span class="sr-only">Search active LiteraryFriend project</span>
        <span aria-hidden="true">⌕</span>
        <input id="globalSearch" type="search" autocomplete="off" placeholder="Search project, notes, scenes, characters, research…">
        <kbd aria-hidden="true">Ctrl K</kbd>
      </label>
      <div class="topbar__actions">
        <button id="quickCaptureBtn" class="button button--secondary" type="button" title="Quick capture (Ctrl+Shift+N)">＋ Capture</button>
        <button id="syncBtn" class="icon-button" type="button" aria-label="Sync LiteraryFriend" title="Sync">↻</button>
        <button id="focusBtn" class="icon-button" type="button" aria-label="Toggle distraction-free focus mode" aria-pressed="false" title="Focus mode">▣</button>
        <button id="themeBtn" class="icon-button" type="button" aria-label="Toggle light and dark appearance" title="Appearance">◐</button>
      </div>
    </header>

    <aside id="sidebar" class="sidebar" aria-label="LiteraryFriend workspaces">
      <section class="project-switcher" aria-labelledby="projectSwitcherLabel">
        <label id="projectSwitcherLabel" for="projectSelect">Active project</label>
        <select id="projectSelect" aria-describedby="projectSwitcherHelp"></select>
        <small id="projectSwitcherHelp">Every writing, planning, organizer, search, and studio view follows this project.</small>
      </section>
      <nav id="primaryNav" class="primary-nav" aria-label="Project tools">
        <button data-view="projects" class="nav-item" type="button"><span aria-hidden="true">▦</span><span>Project Hub</span></button>
        <button data-view="home" class="nav-item is-active" type="button"><span aria-hidden="true">⌂</span><span>Dashboard</span></button>
        <button data-view="manuscript" class="nav-item" type="button"><span aria-hidden="true">✎</span><span>Manuscript</span></button>
        <button data-view="notes" class="nav-item" type="button"><span aria-hidden="true">▧</span><span>Notes & Journal</span></button>
        <button data-view="outline" class="nav-item" type="button"><span aria-hidden="true">☷</span><span>Outline</span></button>
        <button data-view="characters" class="nav-item" type="button"><span aria-hidden="true">☺</span><span>Characters</span></button>
        <button data-view="world" class="nav-item" type="button"><span aria-hidden="true">◎</span><span>World & Lore</span></button>
        <button data-view="timeline" class="nav-item" type="button"><span aria-hidden="true">⌛</span><span>Timeline</span></button>
        <button data-view="storyIntelligence" class="nav-item" type="button"><span aria-hidden="true">⌘</span><span>Story Intelligence</span></button>
        <button data-view="research" class="nav-item" type="button"><span aria-hidden="true">⌕</span><span>Research</span></button>
        <button data-view="language" class="nav-item" type="button"><span aria-hidden="true">Aa</span><span>Language Lab</span></button>
        <button data-view="continuity" class="nav-item" type="button"><span aria-hidden="true">⚑</span><span>Continuity</span></button>
        <button data-view="editorSuite" class="nav-item" type="button"><span aria-hidden="true">✐</span><span>Editor Suite</span></button>
        <button data-view="revision" class="nav-item" type="button"><span aria-hidden="true">✓</span><span>Revision Lab</span></button>
        <button data-view="assistant" class="nav-item" type="button"><span aria-hidden="true">✦</span><span>Literary Assistant</span></button>
        <button data-view="organizer" class="nav-item" type="button"><span aria-hidden="true">☑</span><span>Organizer</span></button>
        <button data-view="imports" class="nav-item" type="button"><span aria-hidden="true">⇩</span><span>Imports</span></button>
        <button data-view="bookBuilding" class="nav-item" type="button"><span aria-hidden="true">▣</span><span>Book Building</span></button>
        <button data-view="publish" class="nav-item" type="button"><span aria-hidden="true">⇧</span><span>Publish</span></button>
      </nav>
      <div class="sidebar__bottom">
        <button data-view="trash" class="nav-item" type="button"><span aria-hidden="true">♲</span><span>Recently Deleted</span></button>
        <button data-view="settings" class="nav-item" type="button"><span aria-hidden="true">⚙</span><span>Settings & Accessibility</span></button>
        <div id="connectionBadge" class="connection-badge" role="status" aria-live="polite"><span class="status-dot"></span><span>Local mode</span></div>
      </div>
    </aside>

    <main id="mainContent" class="workspace" tabindex="-1">
      <div id="viewRoot" class="view-root"></div>
    </main>

    <aside id="inspector" class="inspector" aria-label="Document inspector" hidden>
      <div class="inspector__header"><h2>Inspector</h2><button id="closeInspectorBtn" class="icon-button" type="button" aria-label="Close inspector">×</button></div>
      <div id="inspectorBody" class="inspector__body"></div>
    </aside>
  </div>

  <div id="toastRegion" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="dialogRoot"></div>
  <input id="importInput" type="file" multiple accept=".json,.md,.txt,.html,.docx,.pdf,.rtf,.odt,.csv,.xml,image/*,text/plain,text/markdown,application/json" hidden>
  <input id="attachmentInput" type="file" multiple hidden>
  <input id="scanInput" type="file" accept="image/*" capture="environment" hidden>

  <noscript><p class="noscript">LiteraryFriend requires JavaScript to run. Local writing and accessibility settings stay in this browser unless you explicitly enable synchronization.</p></noscript>

  <script src="js/compat.js"></script>
  <script src="js/core.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/security.js"></script>
  <script src="js/writer-tools.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/accessibility.js"></script>

  <script src="js/lf-core.js"></script>
  <script src="js/lf-backend-config.js"></script>
  <script src="js/lf-store.js"></script>
  <script src="js/lf-session.js"></script>
  <script src="js/lf-api-client.js"></script>
  <script src="js/lf-guest-service.js"></script>
  <script src="js/lf-accessibility.js"></script>
  <script src="js/lf-auth.js"></script>
  <script src="js/lf-google-auth.js"></script>
  <script src="js/lf-project-context.js"></script>
  <script src="js/lf-project-hub.js"></script>
  <script src="js/lf-imports.js"></script>
  <script src="js/lf-manuscript.js"></script>
  <script src="js/lf-outline.js"></script>
  <script src="js/lf-story-intelligence.js"></script>
  <script src="js/lf-continuity.js"></script>
  <script src="js/lf-world.js"></script>
  <script src="js/lf-timeline.js"></script>
  <script src="js/lf-language-lab.js"></script>
  <script src="js/lf-ai-retrieval.js"></script>
  <script src="js/lf-ai-editor.js"></script>
  <script src="js/lf-organizer.js"></script>
  <script src="js/lf-book-builder.js"></script>
  <script src="js/lf-art-document.js"></script>
  <script src="js/lf-art-studio.js"></script>
  <script src="js/lf-search.js"></script>
  <script src="js/lf-read-aloud.js"></script>
  <script src="js/lf-publish.js"></script>
  <script src="js/lf-settings.js"></script>
  <script src="js/lf-vendor-loader.js"></script>
  <script src="js/lf-conversion.js"></script>
  <script src="js/lf-consolidation-ui.js"></script>
  <script src="js/studio-shell-template.js"></script>

  <script src="js/app.js"></script>
  <script src="js/lf-designed-bridge.js"></script>
  <script src="js/final-completion.js"></script>
  <script src="js/pwa.js"></script>
  <script type="module" src="js/functional-runtime-bridge.js"></script>
</body>
</html>
