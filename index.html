<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#001010">
  <meta name="description" content="LiteraryFriend is a local-first, accessible writing companion for manuscripts, journals, notes, research, outlining, worldbuilding, revision, literary planning, and interactive book building.">
  <title>LiteraryFriend — Writing & Book Builder Workspace</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/images/icon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/accessibility.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <link rel="stylesheet" href="css/book-studio.css">
  <link rel="stylesheet" href="css/merged.css">
  <link rel="stylesheet" href="css/connected-features.css">
  <link rel="stylesheet" href="css/feature-hubs.css">
  <link rel="stylesheet" href="css/frontend-parity.css">
</head>
<body class="auth-gated">
  <section id="loginGate" class="lf-login" aria-label="LiteraryFriend account access">
    <div class="lf-login__art" aria-label="LiteraryFriend animated story art">
      <iframe class="lf-login__art-frame" src="assets/LiteraryFriend_aurora_magic_frame.html" title="LiteraryFriend animated magical book artwork" tabindex="-1"></iframe>
    </div>

    <div class="lf-login__panel-wrap">
      <div class="lf-login__panel">
        <header class="lf-login__header">
          <div class="lf-login__wordmark">LiteraryFriend</div>
        </header>

        <div id="loginMessage" class="lf-login__message" role="status" aria-live="polite"></div>

        <section class="lf-login__choice" data-login-panel="choice" aria-label="LiteraryFriend access choices">
          <button id="installLiteraryFriend" class="lf-login__choice-button lf-login__choice-button--install" type="button">
            <span class="lf-login__choice-icon" aria-hidden="true">⇩</span><span>Download app</span>
          </button>
          <button id="openSignIn" class="lf-login__choice-button lf-login__choice-button--primary" type="button" data-login-open="signin">Sign in</button>
          <button id="openSignUp" class="lf-login__choice-button lf-login__choice-button--secondary" type="button" data-login-open="register">Sign up</button>
          <button id="skipLiteraryLogin" class="lf-login__choice-button lf-login__choice-button--skip" type="button">Skip login</button>
        </section>

        <form id="literarySignInForm" class="lf-login__form" data-login-panel="signin" hidden>
          <div class="lf-login__form-head"><h2>Sign in</h2><button class="lf-login__back" type="button" data-login-back aria-label="Back to access choices">← Back</button></div>
          <label class="lf-login__field">
            <span>Email or username</span>
            <input id="literaryLogin" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
          </label>
          <label class="lf-login__field">
            <span>Password</span>
            <span class="lf-login__password">
              <input id="literaryPassword" name="password" type="password" autocomplete="current-password" required>
              <button class="lf-login__reveal" type="button" data-reveal="literaryPassword" aria-label="Show password" aria-pressed="false">Show</button>
            </span>
          </label>
          <button class="lf-login__primary" type="submit">Sign in</button>
          <button id="forgotPasswordBtn" class="lf-login__text-button" type="button">Forgot password?</button>
          <div class="lf-login__google-area" data-google-for="signin">
            <div class="lf-login__divider"><span>or</span></div>
            <div class="googleButtonMount lf-login__google-button" aria-label="Continue with Google"></div>
            <button class="googleSignInFallback lf-login__google-fallback" type="button"><span class="lf-login__google-mark" aria-hidden="true">G</span><span>Continue with Google</span></button>
          </div>
        </form>

        <form id="literaryRegisterForm" class="lf-login__form" data-login-panel="register" hidden>
          <div class="lf-login__form-head"><h2>Sign up</h2><button class="lf-login__back" type="button" data-login-back aria-label="Back to access choices">← Back</button></div>
          <label class="lf-login__field">
            <span>Display name</span>
            <input id="literaryDisplayName" name="name" type="text" autocomplete="name" maxlength="100" required>
          </label>
          <label class="lf-login__field">
            <span>Username</span>
            <input id="literaryUsername" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="24" required>
          </label>
          <label class="lf-login__field">
            <span>Email</span>
            <input id="literaryRegisterEmail" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required>
          </label>
          <label class="lf-login__field">
            <span>Backup phone <small>(optional)</small></span>
            <input id="literaryRegisterPhone" name="tel" type="tel" autocomplete="tel" inputmode="tel" placeholder="Phone number">
          </label>
          <label class="lf-login__field">
            <span>Password</span>
            <span class="lf-login__password">
              <input id="literaryRegisterPassword" name="new-password" type="password" autocomplete="new-password" minlength="10" required>
              <button class="lf-login__reveal" type="button" data-reveal="literaryRegisterPassword" aria-label="Show password" aria-pressed="false">Show</button>
            </span>
          </label>
          <label class="lf-login__field">
            <span>Confirm password</span>
            <span class="lf-login__password">
              <input id="literaryRegisterConfirm" name="new-password-confirm" type="password" autocomplete="new-password" minlength="10" required>
              <button class="lf-login__reveal" type="button" data-reveal="literaryRegisterConfirm" aria-label="Show password" aria-pressed="false">Show</button>
            </span>
          </label>
          <button class="lf-login__primary" type="submit">Create account</button>
          <div class="lf-login__google-area" data-google-for="register">
            <div class="lf-login__divider"><span>or</span></div>
            <div class="googleButtonMount lf-login__google-button" aria-label="Continue with Google"></div>
            <button class="googleSignInFallback lf-login__google-fallback" type="button"><span class="lf-login__google-mark" aria-hidden="true">G</span><span>Continue with Google</span></button>
          </div>
        </form>

        <section id="literaryVerifyPanel" class="lf-login__form" data-login-panel="verify" hidden aria-labelledby="verifyHeading">
          <div class="lf-login__form-head"><h2 id="verifyHeading">Enter verification code</h2><button class="lf-login__back" type="button" data-login-back aria-label="Back to access choices">← Back</button></div>
          <label class="lf-login__field">
            <span>Verification code</span>
            <input id="literaryVerifyCode" name="one-time-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,}" maxlength="10">
          </label>
          <button id="literaryVerifyBtn" class="lf-login__primary" type="button">Verify code</button>
          <button id="literaryVerifyResend" class="lf-login__secondary" type="button" hidden>Send another code</button>
          <button id="literaryVerifyLater" class="lf-login__text-button" type="button" hidden>Verify later</button>
        </section>

        <section id="literaryResetPanel" class="lf-login__form" data-login-panel="reset" hidden aria-labelledby="resetHeading">
          <div class="lf-login__form-head"><h2 id="resetHeading">Forgot password</h2><button class="lf-login__back" type="button" data-login-back-to="signin" aria-label="Back to sign in">← Back</button></div>
          <label class="lf-login__field">
            <span>Email or username</span>
            <input id="literaryResetLogin" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
          </label>
          <button id="literaryRequestReset" class="lf-login__secondary" type="button">Send reset code</button>
          <button id="literaryShowRecoveryLogin" class="lf-login__text-button" type="button">Use a recovery code</button>
          <div id="literaryRecoveryLoginFields" class="lf-login__reset-fields" hidden>
            <label class="lf-login__field"><span>Recovery code</span><input id="literaryRecoveryCode" name="one-time-code" type="text" autocomplete="one-time-code" maxlength="64"></label>
            <button id="literaryRecoveryLoginBtn" class="lf-login__primary" type="button">Sign in with recovery code</button>
          </div>
          <div id="literaryResetFields" class="lf-login__reset-fields" hidden>
            <label class="lf-login__field"><span>Reset code</span><input id="literaryResetCode" name="one-time-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10"></label>
            <label class="lf-login__field"><span>New password</span><span class="lf-login__password"><input id="literaryResetPassword" name="new-password" type="password" autocomplete="new-password" minlength="10"><button class="lf-login__reveal" type="button" data-reveal="literaryResetPassword" aria-label="Show password" aria-pressed="false">Show</button></span></label>
            <button id="literaryCompleteReset" class="lf-login__primary" type="button">Reset password</button>
          </div>
        </section>
      </div>
    </div>
  </section>

  <a class="skip-link" href="#mainContent">Skip to workspace</a>
  <div id="app" class="app-shell" aria-busy="true">
    <header class="topbar" role="banner">
      <button id="navToggle" class="icon-button topbar__menu" type="button" aria-label="Open workspace menu" aria-expanded="false">☰</button>
      <div class="brand-lockup" aria-label="LiteraryFriend">
        <span class="brand-wordmark">LiteraryFriend</span>
        <span class="brand-tagline">accessible writing companion</span>
      </div>
      <label class="topbar__project"><span>Project</span><select id="projectSwitcher" aria-label="Active project"><option value="">Loading projects…</option></select></label>
      <label class="global-search" for="globalSearch">
        <span class="sr-only">Search everything</span>
        <span aria-hidden="true">⌕</span>
        <input id="globalSearch" type="search" autocomplete="off" placeholder="Search notes, scenes, characters, research…">
        <kbd>Ctrl K</kbd>
      </label>
      <div class="topbar__actions">
        <button id="quickCaptureBtn" class="button button--secondary" type="button" title="Quick capture (Ctrl+Shift+N)">＋ Capture</button>
        <button id="syncBtn" class="icon-button" type="button" aria-label="Sync LiteraryFriend" title="Sync">↻</button>
        <button id="focusBtn" class="icon-button" type="button" aria-label="Toggle focus mode" title="Focus mode">▣</button>
        <button id="themeBtn" class="icon-button" type="button" aria-label="Toggle light and dark appearance" title="Appearance">◐</button>
      </div>
    </header>

    <aside id="sidebar" class="sidebar" aria-label="LiteraryFriend workspaces">
      <nav id="primaryNav" class="primary-nav">
        <button data-view="home" class="nav-item is-active" type="button"><span aria-hidden="true">⌂</span><span>Home</span></button>
        <button data-view="projects" class="nav-item" type="button"><span aria-hidden="true">▤</span><span>Projects</span></button>
        <button data-view="manuscript" class="nav-item" type="button"><span aria-hidden="true">✎</span><span>Manuscript</span></button>
        <button data-view="notes" class="nav-item" type="button"><span aria-hidden="true">▧</span><span>Notes & Journal</span></button>
        <button data-view="outline" class="nav-item" type="button"><span aria-hidden="true">☷</span><span>Outline</span></button>
        <button data-view="intelligence" class="nav-item" type="button"><span aria-hidden="true">◫</span><span>Story Intelligence</span></button>
        <button data-view="characters" class="nav-item" type="button"><span aria-hidden="true">☺</span><span>Characters</span></button>
        <button data-view="world" class="nav-item" type="button"><span aria-hidden="true">◎</span><span>World & Lore</span></button>
        <button data-view="timeline" class="nav-item" type="button"><span aria-hidden="true">⌛</span><span>Timeline</span></button>
        <button data-view="research" class="nav-item" type="button"><span aria-hidden="true">⌕</span><span>Research</span></button>
        <button data-view="organizer" class="nav-item" type="button"><span aria-hidden="true">☑</span><span>Organizer</span></button>
        <button data-view="consolidate" class="nav-item" type="button"><span aria-hidden="true">⇄</span><span>Import & Merge</span></button>
        <button data-view="continuity" class="nav-item" type="button"><span aria-hidden="true">⚑</span><span>Plot Holes & Continuity</span></button>
        <button data-view="language" class="nav-item" type="button"><span aria-hidden="true">Aa</span><span>Language Lab</span></button>
        <button data-view="revision" class="nav-item" type="button"><span aria-hidden="true">✓</span><span>Revision Lab</span></button>
        <button data-view="bookbuilder" class="nav-item" type="button"><span aria-hidden="true">▣</span><span>Book Builder</span></button>
        <button data-view="artstudio" class="nav-item" type="button"><span aria-hidden="true">◩</span><span>Art Studio</span></button>
        <button data-view="publish" class="nav-item" type="button"><span aria-hidden="true">↥</span><span>Publish</span></button>
        <button data-view="assistant" class="nav-item" type="button"><span aria-hidden="true">✦</span><span>Literary Assistant</span></button>
        <button data-view="cloud" class="nav-item" type="button"><span aria-hidden="true">☁</span><span>Account</span></button>
      </nav>
      <div class="sidebar__bottom">
        <button data-view="trash" class="nav-item" type="button"><span aria-hidden="true">♲</span><span>Recently Deleted</span></button>
        <button data-view="tutorial" class="nav-item" type="button"><span aria-hidden="true">◈</span><span>Tutorial</span></button>
        <button data-view="docs" class="nav-item" type="button"><span aria-hidden="true">?</span><span>Docs & Licenses</span></button>
        <button data-view="settings" class="nav-item" type="button"><span aria-hidden="true">⚙</span><span>Settings</span></button>
        <div id="connectionBadge" class="connection-badge" role="status"><span class="status-dot"></span><span>Local mode</span></div>
      </div>
    </aside>

    <main id="mainContent" class="workspace" tabindex="-1">
      <div id="viewRoot" class="view-root"></div>
    </main>

    <aside id="inspector" class="inspector" aria-label="Inspector" hidden>
      <div class="inspector__header"><h2>Inspector</h2><button id="closeInspectorBtn" class="icon-button" type="button" aria-label="Close inspector">×</button></div>
      <div id="inspectorBody" class="inspector__body"></div>
    </aside>

    <footer class="project-credit" aria-label="Project compilation credit">Project Compiled by William Saville AKA The Transgender T-Rex #TheTransgenderTRex</footer>
  </div>
  <div id="artStudioDock" hidden></div>

  <div id="toastRegion" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="dialogRoot"></div>
  <input id="importInput" type="file" accept=".docx,.json,.pdf,.txt,.md,.markdown,.html,.htm,.rtf,.csv,.tsv,.xml,.yaml,.yml,.epub,.mobi,.jpg,.jpeg,.png,.gif,.webp,.svg,.mp3,.wav,.m4a,.ogg,.flac,.mp4,.mov,.webm" multiple hidden>
  <input id="attachmentInput" type="file" multiple hidden>
  <input id="scanInput" type="file" accept="image/*" capture="environment" hidden>

  <noscript><p class="noscript">LiteraryFriend requires JavaScript to run. Your writing files remain local unless you choose to sign in and sync.</p></noscript>

  <script src="js/templates-data.js"></script>
  <script src="js/docs-content.js"></script>
  <script src="js/core.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/security.js"></script>
  <script src="js/login.js"></script>
  <script src="js/writer-tools.js"></script>
  <script src="js/import-consolidation.js"></script>
  <script src="js/story-engine.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/accessibility.js"></script>
  <script src="js/art-studio-embed.js"></script>
  <script src="js/book-studio.js"></script>
  <script src="js/capability-contract.js"></script>
  <script src="js/connected-features.js"></script>
  <script src="js/feature-hubs.js"></script>
  <script src="js/frontend-parity.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
  <script src="js/project-switcher.js"></script>
</body>
</html>
